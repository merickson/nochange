[package]
name = "nochange"
version = "0.1.0"
edition = "2024"

[dependencies]
async-trait = "0.1.91"
base64 = "0.22.1"
clap = { version = "4.6.3", features = ["derive"] }
configparser = "3.2.0"
directories = "6.0.0"
fs4 = "1.1.0"
futures-util = "0.3.33"
hex = "0.4.3"
httpdate = "1.0.3"
keyring = "4.1.5"
mailparse = "0.16.1"
oauth2 = "5.0.0"
open = "5.4.0"
percent-encoding = "2.3.2"
reqwest = { version = "0.12.28", default-features = false, features = ["json", "stream", "rustls-tls"] }
rusqlite = { version = "0.40.1", features = ["bundled"] }
secrecy = "0.10.3"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.10.9"
thiserror = "2.0.19"
tempfile = "3.27.0"
tiny_http = "0.12.0"
tokio = { version = "1.53.1", features = ["macros", "rt-multi-thread", "time", "fs", "io-util", "sync"] }
url = "2.5.8"

[dev-dependencies]
assert_cmd = "2.2.2"
predicates = "3.1.4"
wiremock = "0.6.5"
